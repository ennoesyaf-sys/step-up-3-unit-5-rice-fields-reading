.pos{font:400 .78rem var(--mono);color:var(--violet)}

/* fact vs opinion */
.fo{display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;padding:.75rem .95rem;border-bottom:1px solid var(--line);align-items:center}

.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.two ol{margin:0;padding:.7rem 1rem .8rem 2.2rem}
.two li{margin:.3rem 0;font-size:.95rem}

/* genre + language */
.parts{display:grid;gap:.6rem}
.part{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .95rem;display:grid;grid-template-columns:2rem 1fr;gap:.2rem .7rem}
.part .l{font:700 1rem var(--mono);color:var(--violet)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem}
.feat h3{font-family:var(--mono);font-size:.95rem;color:var(--blue)}
.feat .ex{font-style:italic;color:var(--muted);font-size:.93rem}
.feat .here{margin:.4rem 0 0;font-size:.93rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:.8rem}
.ul{margin:.2rem 0 .8rem;padding-left:1.2rem}
.log{font:400 .95rem/1.9 var(--mono);padding:1rem;white-space:pre-wrap}
.log .p{color:var(--ok)}.log .f{color:var(--bad)}.log .n{color:var(--muted)}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(104%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;box-shadow:-10px 0 30px rgba(0,0,0,.18)}

.dtools{display:flex;flex-wrap:wrap;gap:.35rem;padding:.55rem .8rem;border-bottom:1px solid var(--line)}
.dtools button{font:600 .75rem var(--mono);padding:.3rem .55rem;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer}

#plines{flex:1;overflow-y:auto;padding-bottom:1rem}

@media (max-width:760px){
  body{font-size:16px}

@media (prefers-reduced-motion: reduce){#drawer{transition:none}}
</style>

[2,`Their existence is essential for ensuring food security, economic stability, and environmental sustainability in both rural and urban contexts.`]]},

function setMode(m,on){
  const el=$('#plines');el.classList.toggle('show-'+m,on);

function openPassage(lines,mode){
  document.querySelectorAll('.ln.hot').forEach(x=>x.classList.remove('hot'));
  (lines||[]).forEach(n=>{const e=document.querySelector(`#plines .ln[data-l="${n}"]`);if(e)e.classList.add('hot')});

  drawer.classList.add('open');

<div class="win"><div class="wh">fact_opinion.test</div>${FOS.map((x,i)=>{
  const a=f.ans[i];const res=a?(a===x.type?'pass':'fail'):'';
  return `<div class="fo ${res}"><span>${x.t}</span><span class="pair"><button data-act="fo-pick" data-i="${i}" data-v="fact" class="${a==='fact'?'chosen':''}"${a?' disabled':''}>fact</button><button data-act="fo-pick" data-i="${i}" data-v="opinion" class="${a==='opinion'?'chosen':''}"${a?' disabled':''}>opinion</button></span>${a?`<div class="fb ${res}">${res==='pass'?'✓':'✗ It is an '+(x.type==='fact'?'<b>fact</b>':'<b>opinion</b>')+'.'} ${x.why} ${ev(x.ev)}</div>`:''}</div>`}).join('')}</div>
<div class="actions" style="margin:0 0 1rem"><button class="btn" data-act="fo-table">${f.table?'Hide':'Show'} answer table</button><button class="btn" data-act="fo-reset">Reset</button></div>
${f.table||n===FOS.length?`<div class="win"><div class="wh">your table: Preserving Rice Fields for Future Generations</div><div class="two"><div><h3 style="padding:.7rem 1rem 0">Facts</h3><ol>${facts.map(x=>`<li>${x.t} ${ev(x.ev)}</li>`).join('')}</ol></div><div><h3 style="padding:.7rem 1rem 0">Opinions</h3><ol>${ops.map(x=>`<li>${x.t} ${ev(x.ev)}</li>`).join('')}</ol></div></div></div>`:''}
</section>`}

function rGenre(){
  return `<section class="slide">
<h2>What is a discussion text?</h2>
<p class="lead">A discussion text shows different sides of an issue. It gives reasons and evidence, so readers can think and make their own opinion.</p>
<div class="cols"><div>
<h3>Three purposes</h3>
<ul class="ul"><li><b>To give information</b> about an issue, with different opinions and arguments.</li><li><b>To make readers think</b> carefully and form their own opinion.</li><li><b>To start a debate</b> by showing opposite views.</li></ul>
</div><div>
<h3>Structure, with our text</h3>
<div class="parts">
<div class="part"><span class="l">a</span><div><b>Statement of issue</b><br>Introduces the topic and sets the context. ${ev([1,2])}</div></div>
<div class="part"><span class="l">b</span><div><b>List of supporting points</b><br>Points for one side, each in its own paragraph. ${ev([3,4,5,6,7,8,9,10,11])}</div></div>
<div class="part"><span class="l">c</span><div><b>List of contrast points</b><br>The other side: here, the problem and its impact. ${ev([12,13,14,15,16,17,18])}</div></div>
<div class="part"><span class="l">d</span><div><b>Recommendations</b><br>Suggestions after both sides. ${ev([19,20,21])}</div></div>
</div></div></div>
<div class="note">Catatan guru: pada teks ini bagian "contrast" berupa masalah (jumlah sawah menurun), bukan pendapat yang berlawanan. Rekomendasi ada di kalimat terakhir (L21).</div>
<div class="actions"><button class="btn" data-act="topic-mode">Show topic sentences in the text</button></div>
</section>`}

function rLang(){
  return `<section class="slide">
<h2>Language features of a discussion text</h2>
<p class="lead">Tap the line numbers to see each feature highlighted in the text.</p>
<div class="fgrid">${LANG.map(x=>`<div class="feat"><h3>${x.n}</h3><p style="margin:0 0 .4rem">${x.def}</p><p class="ex" style="margin:0 0 .4rem">Book example: ${x.ex}</p>
${x.here?`<p class="here"><b>In our text:</b> ${x.here.map(([l,w])=>`${w} ${ev(l,x.mode)}`).join(' · ')}</p>`:''}
${x.note?`<p class="here" style="color:var(--muted)">${x.note}</p>`:''}</div>`).join('')}</div>
</section>`}

function rRes(){
  const rows=[['match','vocabulary match'],['fill','complete the sentences'],['flow','order of ideas'],['topic','topic sentences'],['q','questions opened'],['fo','fact or opinion']];
  const log=rows.map(([k,l])=>{const s=SCORE[k];const dots='.'.repeat(Math.max(2,30-l.length));return s?`<span class="${s[0]===s[1]?'p':'f'}">${s[0]===s[1]?'pass':'fail'}</span>  ${l} ${dots} ${s[0]}/${s[1]}`:`<span class="n">todo</span>  ${l} ${dots} not done yet`}).join('\n');
  return `<section class="slide">
<h2>Your results</h2>
<div class="win"><div class="wh">results.log</div><div class="log">${log}</div></div>
<h3>Exit ticket</h3>
<ol class="ul"><li>Write one sentence with a new word from this lesson.</li><li>Name the four parts of a discussion text.</li><li>Write one fact and one opinion about rice fields.</li></ol>
<div class="actions"><button class="btn" data-go="0">Back to start</button></div>
</section>`}

const SL=[
{tab:'start.md',r:rStart},{tab:'vocabulary.js',r:rVocab},{tab:'match.test',r:rMatch,k:'match'},{tab:'fill.test',r:rFill,k:'fill'},
{tab:'flow.js',r:rFlow,k:'flow'},{tab:'topic.test',r:rTopic,k:'topic'},{tab:'questions.js',r:rQs,k:'q'},{tab:'fact_opinion.test',r:rFO,k:'fo'},
{tab:'genre.md',r:rGenre},{tab:'language.md',r:rLang},{tab:'results.log',r:rRes}];

/* ============ NAV ============ */
function renderTabs(){
  $('#tabs').innerHTML=SL.map((s,i)=>`<button class="tab${SEEN.has(i)?' seen':''}${s.k&&DONE[s.k]?' done':''}" data-go="${i}" aria-current="${i===cur}"><span class="dot"></span>${s.tab}</button>`).join('');
  const c=document.querySelector('.tab[aria-current="true"]');if(c)c.scrollIntoView({inline:'nearest',block:'nearest'});
}
function show(keep){
  const st=main.scrollTop;SEEN.add(cur);
  main.innerHTML=SL[cur].r();
  main.scrollTop=keep?st:0;
  renderTabs();
  $('#pos').textContent=(cur+1)+' / '+SL.length;
  $('#prev').disabled=cur===0;$('#next').disabled=cur===SL.length-1;
}
function go(i){cur=Math.max(0,Math.min(SL.length-1,i));show(false)}
function finish(k,sc){DONE[k]=true;if(sc)SCORE[k]=sc}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const evb=e.target.closest('.ev');
  if(evb){openPassage(evb.dataset.l.split(',').map(Number),evb.dataset.m);return}
  const g=e.target.closest('[data-go]');
  if(g){go(+g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const d=a.dataset;
  switch(d.act){
    case 'open-text':openPassage([]);break;
    case 'topic-mode':setMode('topic',true);openPassage([]);break;
    case 'vtab':S.vtab=d.v;show(true);break;
    case 'match-check':{const m=S.match;const n=Object.keys(MW).filter(k=>k!=='a'&&m.sel[k]===k).length;m.checked=true;finish('match',[n,7]);show(true);break}
    case 'match-show':{const m=S.match;Object.keys(MW).forEach(k=>m.sel[k]=k);m.checked=true;DONE.match=true;SCORE.match=null;show(true);break}
    case 'match-reset':S.match={sel:{},checked:false};SCORE.match=null;DONE.match=false;show(true);break;
    case 'fill-check':{const f=S.fill;const n=FILL.filter(r=>r.ans.includes(f.sel[r.k])).length;f.checked=true;finish('fill',[n,8]);show(true);break}
    case 'fill-show':{const f=S.fill;FILL.forEach(r=>f.sel[r.k]=r.ans[0]);f.checked=true;DONE.fill=true;SCORE.fill=null;show(true);break}
    case 'fill-reset':S.fill={sel:{},checked:false};SCORE.fill=null;DONE.fill=false;show(true);break;
    case 'flow-pick':{const f=S.flow;if(f.done)break;f.pick.push(d.p);if(f.pick.length===7){f.done=true;f.shown=false;const n=f.pick.filter((p,i)=>p===FORDER[i]).length;finish('flow',[n,7])}show(true);break}
    case 'flow-undo':if(!S.flow.done)S.flow.pick.pop();show(true);break;
    case 'flow-reset':S.flow={pick:[],done:false};SCORE.flow=null;DONE.flow=false;show(true);break;
    case 'flow-show':S.flow={pick:[...FORDER],done:true,shown:true};DONE.flow=true;show(true);break;
    case 'topic-pick':if(!S.topic.checked){S.topic.sel[d.p]=+d.l;show(true)}break;
    case 'topic-check':{const t=S.topic;const n=P.filter(p=>t.sel[p.id]===p.topic).length;t.checked=true;finish('topic',[n,7]);show(true);break}
    case 'topic-show':{const t=S.topic;P.forEach(p=>t.sel[p.id]=p.topic);t.checked=true;DONE.topic=true;SCORE.topic=null;show(true);break}
    case 'topic-reset':S.topic={sel:{},checked:false};SCORE.topic=null;DONE.topic=false;show(true);break;
    case 'q-pick':S.q.i=+d.i;show(true);break;
    case 'q-run':{S.q.shown[QS[S.q.i].k]=true;const n=Object.keys(S.q.shown).length;SCORE.q=[n,9];if(n===9)DONE.q=true;show(true);break}
    case 'fo-pick':{S.fo.ans[d.i]=d.v;const n=Object.keys(S.fo.ans).length;const ok=FOS.filter((x,i)=>S.fo.ans[i]===x.type).length;if(n===FOS.length)finish('fo',[ok,10]);show(true);break}
    case 'fo-table':S.fo.table=!S.fo.table;show(true);break;
    case 'fo-reset':S.fo={ans:{},table:false};SCORE.fo=null;DONE.fo=false;show(true);break;
  }
});
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-kind]');if(!s)return;
  S[s.dataset.kind].sel[s.dataset.k]=s.value;
});
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
$('#btnText').onclick=()=>drawer.classList.contains('open')?closePassage():openPassage([]);
$('#dclose').onclick=closePassage;
$('#dtools').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode,b.getAttribute('aria-pressed')!=='true')});
function curTheme(){const d=document.documentElement.dataset.theme;if(d)return d;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
$('#btnTheme').onclick=()=>{document.documentElement.dataset.theme=curTheme()==='dark'?'light':'dark'};
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;if(t==='SELECT'||t==='TEXTAREA'||t==='INPUT')return;
  if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='p'||e.key==='P')$('#btnText').click();
  else if(e.key==='Escape')closePassage();
});

renderPassage();
show(false);
</script>
</body>
</html>
